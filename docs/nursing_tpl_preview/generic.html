<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>通用护理文书 预览</title><style>
body { margin: 0; background: #e8eaed; display: flex; flex-direction: column; align-items: center; padding: 22px; }
.zoom { zoom: 0.78; }
.sheet { width: 794px; height: 1123px; margin: 0 auto; padding: 38px 49px 53px; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.25); font-family: "PingFang SC","Microsoft YaHei",sans-serif; font-size: 12pt; color: #111; }

.sheet-brand { text-align: center; flex: 1; }
.print-brand-lockup { display: grid; justify-items: center; margin: 0 auto 2px; }
.brand-name-lockup { display: inline-grid; grid-template-columns: minmax(0,1fr); width: max-content; max-width: 100%; min-width: 0; }
.brand-name-line { width: 100%; min-width: 0; text-align: justify; text-align-last: justify; text-justify: inter-character; }
.print-hospital { font-size: 18pt; font-weight: 700; letter-spacing: 4px; line-height: 1.3; }
.print-hospital2 { font-size: 10.5pt; font-weight: 400; line-height: 1.3; }
.sheet-docname { font-size: 15pt; font-weight: 700; letter-spacing: 3px; line-height: 1.35; }
.patient-bar { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 10pt; padding: 4px 0; margin-bottom: 6px; border-bottom: 1px solid #c8ccd4; }
.patient-bar span { white-space: nowrap; }
.patient-bar b { font-weight: 600; }
.tpl-main { width: 100%; font-size: 10pt; border-top: 1px solid #333; border-left: 1px solid #333; }
.tpl-main .tpl-row { display: flex; overflow: hidden; border-bottom: 1px solid #333; }
.tpl-main .tpl-cell, .tpl-main .tpl-label, .tpl-main .tpl-th { border-right: 1px solid #333; padding: 0 6px; display: flex; align-items: center; min-width: 0; }
.tpl-main .tpl-hdr { background: #eef2f6 !important; font-weight: 600; letter-spacing: 2px; text-align: left; }
.tpl-main .tpl-hdr .tpl-cell { flex: 1; }
.tpl-main .tpl-label { background: #f7f9fb; text-align: center; font-weight: 600; font-size: 9.5pt; white-space: normal; line-height: 1.3; justify-content: center; flex-shrink: 0; }
.tpl-main .tpl-th { background: #f2f2f2; font-weight: 600; text-align: center; justify-content: center; flex-shrink: 0; }
.tpl-main .tpl-cell { flex: 1 1 0; flex-wrap: wrap; align-content: center; row-gap: 2px; }
.tpl-main .tpl-seq { text-align: center; color: #909399; font-weight: 600; justify-content: center; flex-shrink: 0; }
.tpl-ctl { border: 1px solid #8a919c; background: #fff; font-size: 10pt; padding: 1px 4px; border-radius: 2px; max-width: 100%; box-sizing: border-box; }
.tpl-ctl-num { border: none; border-bottom: 1px solid #555; background: transparent; width: 60px; text-align: center; font-size: 10pt; }
.tpl-ctl-radio, .tpl-ctl-chk { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; font-size: 10pt; white-space: nowrap; }
.tpl-ctl input { accent-color: #0e7c86; vertical-align: middle; }
.tpl-main .tpl-ctl-sel, .tpl-main .tpl-ctl-dt { border: 1px solid #8a919c; background: #fff; font-size: 10pt; padding: 1px 4px; border-radius: 2px; box-sizing: border-box; max-width: 100%; width: 100%; height: 24px; font-family: inherit; color: #111; }
.tpl-main .tpl-ctl-dt[readonly] { background: #fff; color: #111; cursor: pointer; }
.tpl-main .tpl-ctl-sel option { color: #111; }
textarea.tpl-ctl { resize: none; }
.sheet-page-no { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 9pt; color: #333; }
</style></head><body><div class="zoom"><div class="sheet"><div class="sheet-head"><div class="sheet-brand"><div class="print-brand-lockup"><div class="brand-name-lockup"><div class="brand-name-line print-hospital">淮海省人民医院</div></div></div><div class="sheet-docname">通用护理文书</div></div></div><div class="patient-bar"><span><b>姓名：</b>张明</span><span><b>性别：</b>男</span><span><b>年龄：</b>61 岁</span><span><b>科别：</b>内科</span><span><b>病区：</b>1病区</span><span><b>床号：</b>1</span><span><b>住院号：</b>A202609230001</span><span><b>入院日期：</b>2026-09-23</span></div><div class="tpl-main"><div class="tpl-row" style="height:28px"><div class="tpl-cell tpl-hdr"><b>文书记录</b></div></div><div class="tpl-row" style="height:44px"><div class="tpl-label" style="width:14%"><b>标题/主题</b></div><div class="tpl-cell"><input class="tpl-ctl" placeholder="文书主题" style="width:100%"></div></div><div class="tpl-row tpl-fill" style="height:388px"><div class="tpl-label" style="width:14%"><b>正文内容</b></div><div class="tpl-cell"><textarea class="tpl-ctl" rows="6" style="width:100%"></textarea></div></div><div class="tpl-row tpl-fill" style="height:389px"><div class="tpl-label" style="width:14%"><b>续页记录</b></div><div class="tpl-cell"></div></div><div class="tpl-row" style="height:44px"><div class="tpl-label" style="width:14%"><b>记录护士</b></div><div class="tpl-cell"><select class="tpl-ctl tpl-ctl-sel" data-src="nurses"><option value="选择护士">选择护士</option><option value="张护士" selected>张护士</option><option value="李护士">李护士</option><option value="王护士">王护士</option></select></div><div class="tpl-label" style="width:14%"><b>记录时间</b></div><div class="tpl-cell"><input class="tpl-ctl tpl-ctl-dt" data-dtpicker="datetime" placeholder="年-月-日 时:分" readonly value="2026-11-26 10:00"></div><div class="tpl-label" style="width:14%"><b>护士长审核</b></div><div class="tpl-cell"><select class="tpl-ctl tpl-ctl-sel" data-src="nurses"><option value="选择护士">选择护士</option><option value="张护士">张护士</option><option value="李护士">李护士</option><option value="王护士">王护士</option></select></div></div></div><div class="sheet-page-no">第 1 页 / 共 1 页</div></div></div></body></html>

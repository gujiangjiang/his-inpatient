<div class="flex-between mb-20">
    <h2>医嘱管理</h2>
    <button class="btn btn-primary" onclick="orders_order_list_new()">开嘱</button>
    <button class="btn" onclick="orders_order_list_refresh()">刷新</button>
</div>

<div class="card">
    <table class="table">
        <thead>
            <tr><th>患者</th><th>医嘱类型</th><th>内容</th><th>分类</th><th>状态</th><th>执行时间</th><th>操作</th></tr>
        </thead>
        <tbody id="orders-table-body"></tbody>
    </table>
</div>

<script>
let _ordersPatientCache = [];

async function orders_order_list_init() {
    document.getElementById('main-app').style.display = 'block';
    const user = Auth.user();
    const sidebar = await fetch('/js/shared/sidebar_' + user.role + '.html').then(r => r.text());
    document.getElementById('sidebar').innerHTML = sidebar;
    const result = await AjaxLoader.api('patients/list', {silent:true});
    _ordersPatientCache = result.data || [];
    await loadOrders();
}

async function loadOrders() {
    const result = await AjaxLoader.api('orders/list', {silent:true});
    const tbody = document.getElementById('orders-table-body');
    tbody.innerHTML = '';
    (result.data || []).forEach(o => {
        const tr = document.createElement('tr');
        const patient = _ordersPatientCache.find(p => p.id == o.patient_id);
        tr.innerHTML = `
            <td>${Format.escape(patient?.name || '')}</td>
            <td>${Format.escape(o.order_type || 'general')}</td>
            <td>${Format.escape(o.content)}</td>
            <td>${Format.escape(o.category || '')}</td>
            <td><span class="badge ${Format.orderStatusClass(o.status)}">${Format.orderStatus(o.status)}</span></td>
            <td>${Format.datetime(o.start_date)}</td>
            <td>
                ${o.status === 'pending' ? `<button class="btn btn-small btn-success" onclick="orders_verify(${o.id})">核对</button>` : ''}
                ${o.status === 'verified' || o.status === 'executing' ? `<button class="btn btn-small" onclick="orders_complete(${o.id})">完成</button>` : ''}
            </td>
        `;
        tbody.appendChild(tr);
        if (o.sub_orders && o.sub_orders.length) {
            o.sub_orders.forEach(sub => {
                const subTr = document.createElement('tr');
                subTr.style.background = '#f8f8f8';
                subTr.innerHTML = `
                    <td></td><td colspan="5" style="padding-left:30px">
                        <span class="badge badge-default">子医嘱</span>
                        ${Format.escape(sub.content)}
                        <span class="badge ${Format.orderStatusClass(sub.status)}">${Format.orderStatus(sub.status)}</span>
                    </td>
                `;
                tbody.appendChild(subTr);
            });
        }
    });
}

function orders_order_list_new() {
    const content = `
        <div class="form-group">
            <label class="form-label">患者</label>
            <select id="order-patient" class="form-control">
                <option value="">请选择</option>
                ${_ordersPatientCache.map(p => `<option value="${p.id}">${Format.escape(p.name)} (${p.admission_no})</option>`).join('')}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">医嘱内容</label>
            <input type="text" id="order-content" class="form-control" placeholder="输入医嘱内容">
        </div>
        <div class="form-group">
            <label class="form-label">分类</label>
            <select id="order-category" class="form-control">
                <option value="">非药品</option>
                <option value="medication">用药</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">子医嘱 (JSON 数组)</label>
            <textarea id="sub-orders" class="form-control" rows="3" placeholder='[{"type":"medication","content":"5%葡萄糖 250ml"},{"type":"medication","content":"头孢呋辛 1.5g"}]'></textarea>
        </div>
    `;
    Dom.modal('开医嘱', content, [
        {text:'保存',type:'primary',onclick:async function(){
            const patientId = document.getElementById('order-patient').value;
            const contentVal = document.getElementById('order-content').value;
            const category = document.getElementById('order-category').value;
            let subOrders = [];
            try { subOrders = JSON.parse(document.getElementById('sub-orders').value || '[]'); } catch(e) {}
            await AjaxLoader.api('orders/save', {
                method:'POST',
                data:{ patient_id: patientId, content: contentVal, category: category || null,
                order_type: 'general', sub_orders: subOrders.length ? subOrders : undefined }
            });
            loadOrders();
        }},
        {text:'取消',type:'default'}
    ]);
}

function orders_verify(id) {
    AjaxLoader.api('orders/verify', {method:'POST',data:{id, status:'verified'}}).then(() => loadOrders());
}

function orders_complete(id) {
    AjaxLoader.api('orders/status', {method:'POST',data:{id, status:'completed'}}).then(() => loadOrders());
}

function orders_order_list_refresh() { loadOrders(); }
function navigateTo(m,p){ AjaxLoader.loadPage(m,p); }
</script>

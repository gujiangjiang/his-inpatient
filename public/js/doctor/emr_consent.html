<div class="flex-between mb-20">
    <h2>告知记录</h2>
    <select id="patient-select" class="form-control" style="width:200px" onchange="loadPatientForConsent(this.value)">
        <option value="">选择患者</option>
    </select>
    <button class="btn btn-success" onclick="doctor_emr_consent_save()">保存告知记录</button>
</div>

<div class="card">
    <div class="card-header">
        告知记录
        <button class="btn btn-small btn-success" style="float:right" onclick="TemplatePicker.select('consent', function(t) { if(t) { RichEditor.create('editor-container', t.content_delta); } })">从模板插入</button>
    </div>
    <div style="padding:15px">
        <div id="editor-container"></div>
    </div>
</div>

<script>
let _consentPatient = null, _patientsCache2 = [];
async function doctor_emr_consent_init() {
    document.getElementById('main-app').style.display = 'block';
    const sidebar = await fetch('/js/shared/sidebar_doctor.html').then(r => r.text());
    document.getElementById('sidebar').innerHTML = sidebar;
    const result = await AjaxLoader.api('patients/list', {silent:true});
    _patientsCache2 = result.data || [];
    const sel = document.getElementById('patient-select');
    _patientsCache2.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name + ' (' + p.admission_no + ')';
        sel.appendChild(opt);
    });
}
function loadPatientForConsent(id){ _consentPatient = _patientsCache2.find(p=>p.id==id); }
async function doctor_emr_consent_save() {
    if(!_consentPatient){ Dom.toast('请选择患者','error'); return; }
    const e = RichEditor.create('editor-container');
    const delta = e.getDelta();
    if(!delta||delta==='{}'){ Dom.toast('请输入内容','error'); return; }
    await AjaxLoader.api('emr/save',{method:'POST',data:{patient_id:_consentPatient.id,record_type:'consent',content_delta:delta,content_html:e.getHTML()}});
    Dom.toast('保存成功','success');
}
function navigateTo(m,p){ AjaxLoader.loadPage(m,p); }
</script>

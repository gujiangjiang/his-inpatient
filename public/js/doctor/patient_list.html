<div class="flex-between mb-20">
    <h2>患者管理</h2>
    <button class="btn btn-primary" onclick="doctor_patient_new()">登记患者</button>
</div>

<div class="card">
    <table class="table">
        <thead>
            <tr>
                <th>住院号</th><th>姓名</th><th>性别</th><th>年龄</th><th>科室</th><th>病区</th><th>床号</th><th>入院日期</th><th>状态</th><th>操作</th>
            </tr>
        </thead>
        <tbody id="patient-table-body"></tbody>
    </table>
</div>

<script>
let _deptList = [];
let _wardList = [];

async function doctor_patient_list_init() {
    document.getElementById('main-app').style.display = 'block';
    document.getElementById('login-container').style.display = 'none';
    const sidebar = await fetch('/js/shared/sidebar_doctor.html').then(r => r.text());
    document.getElementById('sidebar').innerHTML = sidebar;
    
    // 加载科室病区下拉数据
    const [deptRes, wardRes] = await Promise.all([
        AjaxLoader.api('admin/department-list', {silent:true}),
        AjaxLoader.api('admin/ward-list', {silent:true})
    ]);
    _deptList = deptRes.data || [];
    _wardList = wardRes.data || [];
    
    loadPatients();
}

async function loadPatients() {
    const result = await AjaxLoader.api('patients/list', { silent: true });
    const tbody = document.getElementById('patient-table-body');
    tbody.innerHTML = '';
    (result.data || []).forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${Format.escape(p.admission_no)}</td>
            <td>${Format.escape(p.name)}</td>
            <td>${Format.gender(p.gender)}</td>
            <td>${p.birth_date ? (new Date().getFullYear() - new Date(p.birth_date).getFullYear()) : ''}</td>
            <td>${Format.escape(p.department_name || '')}</td>
            <td>${Format.escape(p.ward_name || '')}</td>
            <td>${Format.escape(p.bed_no || '')}</td>
            <td>${Format.datetime(p.admission_date)}</td>
            <td>${p.status === 'active' ? '<span class="badge badge-success">在院</span>' : '<span class="badge badge-default">出院</span>'}</td>
            <td>
                <button class="btn btn-small" onclick="doctor_patient_edit(${p.id})">编辑</button>
                <button class="btn btn-small btn-danger" onclick="doctor_patient_discharge(${p.id})">出院</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function doctor_patient_new() {
    let deptOptions = _deptList.map(d => ({label: d.name, value: d.id})).join('');
    let wardOptions = _wardList.map(w => ({label: w.name + ' (' + w.code + ')', value: w.id})).join('');
    
    // 重新生成 option
    let deptHtml = '<option value="">请选择</option>';
    _deptList.forEach(d => { deptHtml += '<option value="' + d.id + '">' + Format.escape(d.name) + '</option>'; });
    let wardHtml = '<option value="">请选择</option>';
    _wardList.forEach(w => { wardHtml += '<option value="' + d.id + '">' + Format.escape(w.name) + '</option>'; });

    const content = `
        <form id="patient-form" style="max-height:60vh;overflow-y:auto">
            ${Dom.formField({name:'name',label:'姓名',type:'text'}, '')}
            ${Dom.formField({name:'gender',label:'性别',type:'select',options:[{label:'男',value:'male'},{label:'女',value:'female'}]}, '')}
            ${Dom.formField({name:'birth_date',label:'生日',type:'date'}, '')}
            ${Dom.formField({name:'id_card',label:'身份证号',type:'text'}, '')}
            ${Dom.formField({name:'admission_diagnosis',label:'入院诊断',type:'text'}, '')}
            <input type="hidden" name="admission_icd_code" id="admission_icd_code">
            <div class="form-group">
                <label class="form-label">科室</label>
                <select name="department_id" class="form-control">${deptHtml}</select>
            </div>
            <div class="form-group">
                <label class="form-label">病区</label>
                <select name="ward_id" class="form-control">${wardHtml}</select>
            </div>
            ${Dom.formField({name:'bed_no',label:'床号',type:'text'}, '')}
            ${Dom.formField({name:'admission_date',label:'入院日期',type:'datetime'}, new Date().toISOString().slice(0,16))}
        </form>
    `;
    
    Dom.modal('入院登记', content, [
        {text:'保存',type:'primary',onclick:async function(){
            const form = document.getElementById('patient-form');
            const data = {};
            new FormData(form).forEach((v, k) => data[k] = v);
            const result = await AjaxLoader.api('patients/save', {method:'POST',data});
            if (result) { loadPatients(); }
        }},
        {text:'取消',type:'default'}
    ]);
    
    // ICD-10 搜索初始化
    setTimeout(() => IcdSearch.init('admission_diagnosis', 'admission_icd_code'), 100);
}

function doctor_patient_discharge(id) {
    Dom.modal('确认出院', '<p>确认患者出院吗？</p>', [
        {text:'确认',type:'danger',onclick:async function(){
            await AjaxLoader.api('patients/discharge', {method:'POST',data:{id}});
            loadPatients();
        }},
        {text:'取消',type:'default'}
    ]);
}

function doctor_patient_edit(id) {
    Dom.toast('编辑功能开发中', 'info');
}

function navigateTo(module, page) {
    AjaxLoader.loadPage(module, page);
}
</script>
